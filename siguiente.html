    position: fixed; inset: 0; z-index: 40;
    background: #05030c;
    font-family: 'Quicksand', sans-serif;

    -webkit-tap-highlight-color: transparent;
    opacity: 0; visibility: hidden;
    transition: opacity 1.4s ease, visibility 1.4s ease;
  }
  #universo-wrap.visible { opacity: 1; visibility: visible; }
  #universo-wrap canvas { display: block; touch-action: none; }

  #titulo {
    position: absolute; top: 30px; left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 5;
    font-family: 'Caveat', cursive;
    font-size: clamp(1.8em, 5vw, 3em);
    color: #ffe3f7;
    text-shadow: 0 0 10px #ff5fd1, 0 0 22px #ff00c8;
    letter-spacing: 1px;
  }
  #ayuda {
    position: absolute; bottom: 16px; left: 0; right: 0;
    text-align: center; z-index: 5; pointer-events: none;
    color: rgba(255,243,196,.55); font-size: .8em;
    transition: opacity 1s ease;
  }
  #volver {
    position: absolute; bottom: 14px; left: 16px; z-index: 6;
    color: rgba(255,243,196,.4); font-size: .75em; text-decoration: none;
    transition: color .2s ease;
  }
  #volver:hover { color: rgba(255,243,196,.9); }
  #universo-error {
    display: none; position: absolute; inset: 0; z-index: 7;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    font-family: 'Caveat', cursive; font-size: 1.6em; color: #fff3c4;
  }
  #universo-error.mostrar { display: flex; }
</style>

<script type="module">
/* ============================================================
   1. FECHA QUE ABRE LA PÁGINA — cámbiala aquí cuando quieras
   ============================================================ */
const FECHA_SECRETA = { dia: 13, mes: 2, anio: 2008 };

const loginScreen  = document.getElementById('login-screen');
const dateForm     = document.getElementById('date-form');
const dateInput    = document.getElementById('fecha');
const dateError    = document.getElementById('date-error');
const universoWrap = document.getElementById('universo-wrap');
const universoErr  = document.getElementById('universo-error');
const ayuda        = document.getElementById('ayuda');
const musica       = document.getElementById('musica');

// Acepta 15/12/2023, 15-12-2023, 15.12.2023, 15/12/23 o 15122023
function parseFecha(texto){
  const m = texto.trim().match(/^(\d{1,2})\D*(\d{1,2})\D*(\d{4}|\d{2})$/);
  if(!m) return null;
  let anio = parseInt(m[3], 10);
  if(m[3].length === 2) anio += 2000;
  return { dia: parseInt(m[1], 10), mes: parseInt(m[2], 10), anio };
}

dateInput.addEventListener('input', ()=>{ dateError.textContent = ''; });

dateForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  const f = parseFecha(dateInput.value);
  const ok = f && f.dia === FECHA_SECRETA.dia && f.mes === FECHA_SECRETA.mes && f.anio === FECHA_SECRETA.anio;

  if(ok){
    dateError.textContent = '';
    loginScreen.classList.add('bloom-out');
    setTimeout(()=>{ loginScreen.style.display = 'none'; }, 950);
    abrirUniverso();
  } else {
    dateError.textContent = 'Esa no es la fecha que abre la puerta ♥';
    dateForm.classList.remove('shake');
    void dateForm.offsetWidth;          // reinicia la animación
    dateForm.classList.add('shake');
    dateInput.select();
  }
});

/* ============================================================
   2. PARTÍCULAS DE FONDO (solo detrás de la puerta de la fecha)
   ============================================================ */
const canvasFondo = document.getElementById('particles');
const ctxFondo = canvasFondo.getContext('2d');
let particulas = [];
let fondoActivo = true;

function ajustarFondo(){
  canvasFondo.width = window.innerWidth;
  canvasFondo.height = window.innerHeight;
}
ajustarFondo();
window.addEventListener('resize', ajustarFondo);

function crearParticulas(){
  const count = window.innerWidth < 640 ? 45 : 90;
  particulas = Array.from({length:count}, ()=>({
    x: Math.random()*canvasFondo.width,
    y: Math.random()*canvasFondo.height,
    r: Math.random()*1.8 + .4,
    vy: -(Math.random()*.35 + .08),
    vx: (Math.random()-.5)*.15,
    hue: Math.random() > .5 ? '255,46,196' : '176,38,255',
    a: Math.random()*.5 + .2
  }));
}
crearParticulas();

function dibujarFondo(){
  if(!fondoActivo) return;                       // al abrir el universo se detiene, para ahorrar batería
  ctxFondo.clearRect(0,0,canvasFondo.width,canvasFondo.height);
  particulas.forEach(p=>{
    p.y += p.vy; p.x += p.vx;
    if(p.y < -10) p.y = canvasFondo.height + 10;
    if(p.x < -10) p.x = canvasFondo.width + 10;
    if(p.x > canvasFondo.width+10) p.x = -10;
    ctxFondo.beginPath();
    ctxFondo.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctxFondo.fillStyle = `rgba(${p.hue},${p.a})`;
    ctxFondo.shadowBlur = 8;
    ctxFondo.shadowColor = `rgba(${p.hue},.8)`;
    ctxFondo.fill();
  });
  requestAnimationFrame(dibujarFondo);
}
dibujarFondo();

/* ============================================================
   3. ABRIR EL UNIVERSO (al escribir la fecha correcta)
   ============================================================ */
let universoIniciado = false;

async function abrirUniverso(){
  universoWrap.classList.add('visible');
  universoWrap.setAttribute('aria-hidden', 'false');
  fondoActivo = false;
  setTimeout(()=>{ ayuda.style.opacity = 0; }, 6000);

  musica.volume = 0.5;
  musica.play().catch(() => {});                 // si no hay archivo de música, simplemente no pasa nada

  if(universoIniciado) return;
  universoIniciado = true;
  try{
    const THREE = await import('three');
    iniciarUniverso(THREE);
  }catch(err){
    console.error(err);
    universoIniciado = false;
    universoErr.classList.add('mostrar');
  }
}

// Fotos flotantes. Pon tus archivos en la carpeta /img y agrégalos aquí.

const FOTOS = [
  // "img/foto1.jpg",
  // "img/foto2.jpg",
];

// Flores flotantes: tulipanes, rosas y amapolas.
// No existe emoji oficial de amapola, así que se usa 🌺 como la más parecida.
const FLORES = [
  "🌷","🌹","🌺","🌷","🌹","🌺","🌷","🌹",
  "🌺","🌷","🌹","🌺","🌷","🌹","🌺","🌷",
  "🌹","🌺","🌷","🌹",
];

/* ========================================================================= */

function iniciarUniverso(THREE){
  const canvas = document.getElementById("universo");

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05030c, 0.006);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);

  /* ---------- Cámara orbital manual (arrastrar + zoom) ---------- */
  const cam = { radius: 55, minRadius: 12, maxRadius: 140, theta: 0.6, phi: 1.25 };
  function actualizarCamara() {
    cam.phi = Math.max(0.25, Math.min(Math.PI - 0.25, cam.phi));
    camera.position.set(
      cam.radius * Math.sin(cam.phi) * Math.sin(cam.theta),
      cam.radius * Math.cos(cam.phi),
      cam.radius * Math.sin(cam.phi) * Math.cos(cam.theta)
    );
    camera.lookAt(0, 0, 0);
  }
  actualizarCamara();

  let arrastrando = false, prevX = 0, prevY = 0;
  canvas.addEventListener("pointerdown", e => { arrastrando = true; prevX = e.clientX; prevY = e.clientY; });
  window.addEventListener("pointerup", () => arrastrando = false);
  window.addEventListener("pointermove", e => {
    if (!arrastrando) return;
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    cam.theta -= dx * 0.005;
    cam.phi -= dy * 0.005;
    actualizarCamara();
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    cam.radius = Math.min(cam.maxRadius, Math.max(cam.minRadius, cam.radius + e.deltaY * 0.05));
    actualizarCamara();
  }, { passive: false });

  // Zoom con pellizco (móvil)
  let distanciaPrevia = null;
  canvas.addEventListener("touchmove", e => {
    if (e.touches.length === 2) {
      const [t1, t2] = e.touches;
      const d = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      if (distanciaPrevia !== null) {
        cam.radius = Math.min(cam.maxRadius, Math.max(cam.minRadius, cam.radius - (d - distanciaPrevia) * 0.15));
        actualizarCamara();
      }
      distanciaPrevia = d;
    }
  }, { passive: true });
  canvas.addEventListener("touchend", () => distanciaPrevia = null);

  /* ---------- Campo de estrellas ---------- */
  function crearEstrellas(cantidad, tamaño, color, radio) {
    const posiciones = new Float32Array(cantidad * 3);
    for (let i = 0; i < cantidad; i++) {
      const r = radio * (0.3 + Math.random() * 0.7);
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      posiciones[i * 3]     = r * Math.sin(p) * Math.cos(t);
      posiciones[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
      posiciones[i * 3 + 2] = r * Math.cos(p);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(posiciones, 3));
    const mat = new THREE.PointsMaterial({ size: tamaño, color, transparent: true, opacity: 0.9, depthWrite: false });
    return new THREE.Points(geo, mat);
  }
  scene.add(crearEstrellas(2600, 0.5, 0xffffff, 400));
  scene.add(crearEstrellas(500, 0.9, 0xffe9a8, 250));

  /* ---------- Agujero negro con anillo dorado ---------- */
  const nucleo = new THREE.Mesh(
    new THREE.SphereGeometry(3.2, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  scene.add(nucleo);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(3.6, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0xff00c8, transparent: true, opacity: 0.14 })
  );
  scene.add(halo);

  const anillo = new THREE.Mesh(
    new THREE.RingGeometry(4.2, 7.5, 96),
    new THREE.MeshBasicMaterial({ color: 0xff33cc, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
  );
  anillo.rotation.x = Math.PI / 2.4;
  scene.add(anillo);

  const anillo2 = anillo.clone();
  anillo2.material = anillo.material.clone();
  anillo2.material.opacity = 0.35;
  anillo2.scale.set(1.35, 1.35, 1.35);
  anillo2.rotation.x = Math.PI / 2.1;
  anillo2.rotation.z = 0.4;
  scene.add(anillo2);

  /* ---------- Texto flotante (sprites generados en canvas) ---------- */
  function crearSpriteTexto(texto, color = "#fff3c4") {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    const escala = 64;
    ctx.font = `${escala}px "Caveat"`;
    const ancho = Math.max(200, ctx.measureText(texto).width + 40);
    c.width = ancho; c.height = escala * 1.6;

    ctx.font = `${escala}px "Caveat"`;
    ctx.textBaseline = "middle";
    ctx.shadowColor = "#ffb703";
    ctx.shadowBlur = 18;
    ctx.fillStyle = color;
    ctx.fillText(texto, 20, c.height / 2);

    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    const escalaMundo = c.width / 60;
    sprite.scale.set(escalaMundo, escalaMundo * (c.height / c.width), 1);
    return sprite;
  }

  function crearSpriteFlor(emoji) {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    const escala = 110;
    c.width = escala * 1.3; c.height = escala * 1.3;
    ctx.font = `${escala}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(emoji, c.width / 2, c.height / 2 + 6);

    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    const escalaMundo = 3 + Math.random() * 2;
    sprite.scale.set(escalaMundo, escalaMundo, 1);
    return sprite;
  }

  function construirEscenaFlores() {
    const grupoFlores = new THREE.Group();
    FLORES.forEach(emoji => {
      const sprite = crearSpriteFlor(emoji);
      const radio = 14 + Math.random() * 20;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      sprite.position.set(
        radio * Math.sin(p) * Math.cos(t),
        radio * Math.sin(p) * Math.sin(t) * 0.6,
        radio * Math.cos(p)
      );
      sprite.userData = { base: sprite.position.clone(), fase: Math.random() * Math.PI * 2 };
      grupoFlores.add(sprite);
    });
    scene.add(grupoFlores);
    animables.push(grupoFlores);
  }

  // Espera a que la fuente cargue para que el texto no se vea con la fuente por defecto
  document.fonts.load('64px "Caveat"').then(construirEscenaTexto);
  function construirEscenaTexto() {
    const grupoTextos = new THREE.Group();
    FRASES.forEach((frase, i) => {
      const sprite = crearSpriteTexto(frase);
      const radio = 16 + Math.random() * 18;
      const t = Math.random() * Math.PI * 2;
      const p = Math.acos(2 * Math.random() - 1);
      sprite.position.set(
        radio * Math.sin(p) * Math.cos(t),
        radio * Math.sin(p) * Math.sin(t) * 0.6,
        radio * Math.cos(p)
      );
      sprite.userData = { base: sprite.position.clone(), fase: Math.random() * Math.PI * 2 };
      grupoTextos.add(sprite);
    });
    scene.add(grupoTextos);
    animables.push(grupoTextos);
  }

  /* ---------- Fotos flotantes ---------- */
  const cargador = new THREE.TextureLoader();
  const grupoFotos = new THREE.Group();
  FOTOS.forEach((ruta, i) => {
    cargador.load(ruta, textura => {
      const rel = textura.image.width / textura.image.height || 1;
      const alto = 7;
      const geo = new THREE.PlaneGeometry(alto * rel, alto);
      const mat = new THREE.MeshBasicMaterial({ map: textura, transparent: true, side: THREE.DoubleSide });
      const marco = new THREE.Mesh(geo, mat);
      const radio = 20 + Math.random() * 14;
      const t = (i / Math.max(1, FOTOS.length)) * Math.PI * 2 + Math.random();
      const p = Math.PI / 2 + (Math.random() - 0.5) * 1.4;
      marco.position.set(
        radio * Math.sin(p) * Math.cos(t),
        radio * Math.sin(p) * Math.sin(t) * 0.6,
        radio * Math.cos(p)
      );
      marco.userData = { base: marco.position.clone(), fase: Math.random() * Math.PI * 2 };
      grupoFotos.add(marco);
    });
  });
  scene.add(grupoFotos);
  const animables = [grupoFotos];
  construirEscenaFlores();

  /* ---------- Bucle de animación ---------- */
  const reloj = new THREE.Clock();
  function animar() {
    const t = reloj.getElapsedTime();

    anillo.rotation.z = t * 0.06;
    anillo2.rotation.z = -t * 0.04;
    nucleo.rotation.y = t * 0.1;

    animables.forEach(grupo => {
      grupo.children.forEach(obj => {
        const { base, fase } = obj.userData;
        if (!base) return;
        obj.position.y = base.y + Math.sin(t * 0.6 + fase) * 0.6;
        obj.lookAt(camera.position); // que siempre miren hacia la cámara
      });
    });

    renderer.render(scene, camera);
    requestAnimationFrame(animar);
  }
  animar();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
</script>
</body>
</html>
